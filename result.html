<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>블록깨기 - 결과</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>게임 결과</h1>

      <div>
        <p>
          결과:
          <strong id="resultType">-</strong>
        </p>

        <p>
          최종 점수:
          <strong id="resultScore">0</strong>
        </p>

        <p>
          도달 레벨:
          <strong id="resultLevel">1</strong>
        </p>
      </div>

      <div class="btn-group">
        <button id="restartBtn" type="button">다시하기</button>
        <button id="mainMenuBtn" type="button">메인메뉴</button>
      </div>
    </div>

    <script src="./js/result.js"></script>
  </body>
</html>
